# Render Blueprint. See: https://render.com/docs/blueprint-spec
#
# Deploys AnimeDB Bot as a Web Service running in webhook mode.
#
# NOTE (as of 2026): Render removed the free instance type for
# Background Workers — free instances are only available for Web
# Services, Postgres, and their Redis-compatible cache now. A polling
# Background Worker (the simpler mode — see README section 13) needs at
# least the paid Starter plan. This Blueprint defaults to Web Service +
# webhook mode specifically so it works on the free plan; switch to a
# `type: worker` + polling setup instead if you're on a paid plan and
# prefer the simplicity (see the commented block at the bottom).
#
# Free-tier web services sleep after inactivity and cold-start on the
# next request — Telegram's webhook delivery will wake it, just with a
# few seconds of extra latency on the first message after idle time.
#
# `preDeployCommand` runs `alembic upgrade head` after each build but
# before the new instance starts serving — migrations are applied
# automatically on every deploy.

databases:
  - name: animedb-postgres
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: animedb-bot
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    preDeployCommand: python -m alembic upgrade head
    envVars:
      - key: BOT_TOKEN
        sync: false # set manually in the Render dashboard — never commit this
      - key: ADMIN_IDS
        sync: false # comma-separated Telegram user IDs
      - key: DATABASE_URL
        fromDatabase:
          name: animedb-postgres
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: PORT
        value: "8080"
      - key: WEBHOOK_URL
        sync: false # set AFTER first deploy — see step below
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: ANILIST_API_URL
        value: https://graphql.anilist.co
      - key: ANILIST_RATE_LIMIT_PER_MINUTE
        value: "25"
      - key: JIKAN_BASE_URL
        value: https://api.jikan.moe/v4
      - key: JIKAN_RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: KITSU_BASE_URL
        value: https://kitsu.io/api/edge
      - key: KITSU_RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: BACKGROUND_SYNC_ENABLED
        value: "true"
      - key: BACKGROUND_SYNC_INTERVAL_SECONDS
        value: "3600"
      - key: BACKGROUND_SYNC_BATCH_SIZE
        value: "20"

# --- Setting WEBHOOK_URL (one-time, after first deploy) ---
# 1. Deploy once with WEBHOOK_URL left blank — the service starts in
#    polling mode as a harmless fallback for this first deploy. Note a
#    free Web Service with no inbound HTTP traffic will still go idle
#    between Render's own health checks; that resolves itself once step
#    4 below is done and Telegram starts pushing webhook requests in.
# 2. Render assigns a public URL like https://animedb-bot.onrender.com —
#    copy the exact one from the service's dashboard page (it may differ
#    if that name was already taken).
# 3. Set WEBHOOK_URL to that URL + any path, e.g.
#    https://animedb-bot.onrender.com/webhook/tg
# 4. Save — Render redeploys, and app/main.py registers the webhook with
#    Telegram automatically on startup (bot.set_webhook(...)).

# --- Switching to a polling Background Worker instead (paid plan only) ---
# 1. Change `type: web` to `type: worker` above.
# 2. Remove `healthCheckPath` (not used by workers).
# 3. Change `plan: free` to `plan: starter` (or higher) — no free
#    instance type exists for workers.
# 4. Remove the WEBHOOK_URL and WEBHOOK_SECRET envVars entirely — leaving
#    WEBHOOK_URL unset is what puts the bot back into polling mode.
